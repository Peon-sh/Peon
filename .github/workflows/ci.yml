name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan repository history
        run: gitleaks detect --source . --config .gitleaks.toml --verbose --no-banner

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Free npm advisory DB — fail on high/critical production vulns.
      - run: pnpm audit --prod --audit-level=high

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  integration:
    name: API integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: peon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PEON_E2E: '1'
      PEON_TEST_PORT: '3100'
      PEON_TEST_BASE_URL: http://127.0.0.1:3100
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/peon_test?schema=public
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/peon_test?schema=public
      JWT_SECRET: test-jwt-secret-at-least-32-chars!!
      JWT_KEY: peon-auth-token
      ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      APP_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      EMAIL_DRIVER: test
      INSTANCE_OWNER_EMAIL: owner@peon.test
      SQS_DEPLOYMENT_QUEUE_URL: http://localhost:9324/000000000000/peon-deployments
      SQS_TASKS_QUEUE_URL: http://localhost:9324/000000000000/peon-tasks
      S3_BUCKET: peon-test-bucket
      GITHUB_APP_ID: '12345'
      GITHUB_APP_SLUG: peon-test
      GITHUB_APP_WEBHOOK_SECRET: whsec-test
      GITHUB_APP_PRIVATE_KEY: |
        -----BEGIN RSA PRIVATE KEY-----
        MIIBOgIBAAJBAKtest
        -----END RSA PRIVATE KEY-----
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm build
      - run: pnpm test:integration
        env:
          PEON_TEST_SKIP_BUILD: '1'
