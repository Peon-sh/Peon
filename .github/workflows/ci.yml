name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan repository history
        run: gitleaks detect --source . --config .gitleaks.toml --verbose --no-banner

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # npm retired legacy /security/audits endpoints; pnpm 10.x audit is broken.
      # Use pnpm 11 for audit only (packageManager still pins 10.8.0 for installs).
      # Unpin before pnpm/action-setup so it does not conflict with packageManager.
      - name: Unpin packageManager for audit
        run: |
          node <<'EOF'
          const fs = require('fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          delete pkg.packageManager
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          EOF
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Free npm advisory DB — fail on high/critical production vulns.
      # Lockfile alone is enough; no install required.
      - run: pnpm audit --prod --audit-level=high

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  compose-validate:
    name: Compose config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `docker compose config` needs the referenced env_file to exist.
      - name: Create a .env for validation
        run: cp .env.example .env
      - name: Validate every committed compose file
        run: |
          set -e
          for f in docker-compose*.yml; do
            echo "::group::$f"
            docker compose -f "$f" config -q
            echo "ok: $f"
            echo "::endgroup::"
          done
      - name: Assert the Docker socket is never mounted into a web service
        # Decision D6: only the worker / execution layer may reach Docker.
        # Parsed from the resolved config as JSON rather than grepped, so this
        # cannot be fooled by formatting or by anchors/extension fields.
        run: |
          set -e
          for f in docker-compose*.yml; do
            docker compose -f "$f" config --format json > /tmp/compose.json
            python3 - "$f" <<'EOF'
          import json, sys
          path = sys.argv[1]
          cfg = json.load(open('/tmp/compose.json'))
          WEB = {'app', 'web', 'migrate'}
          bad = []
          for name, svc in (cfg.get('services') or {}).items():
              if name not in WEB:
                  continue
              for vol in (svc.get('volumes') or []):
                  src = vol.get('source', '') if isinstance(vol, dict) else str(vol)
                  if 'docker.sock' in src:
                      bad.append(f'{name}: {src}')
          if bad:
              print(f'FAIL: {path} mounts the Docker socket into a non-worker service:')
              for b in bad:
                  print('  ' + b)
              sys.exit(1)
          print(f'ok: {path}')
          EOF
          done

  selfhost-smoke:
    name: Self-host fresh-install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate a .env with real secrets
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=$(openssl rand -base64 32)|" .env
      - name: Boot the stack from an empty volume
        run: docker compose up -d --build --wait --wait-timeout 900
      - name: Assert migrations ran
        run: |
          docker compose exec -T postgres \
            psql -U postgres -d peon -tAc \
            "select count(*) from _prisma_migrations where finished_at is not null" > /tmp/migrations
          applied=$(cat /tmp/migrations)
          echo "applied migrations: $applied"
          test "$applied" -gt 0
      - name: Assert the app answers /api/health
        run: |
          code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:3000/api/health)
          echo "status=$code body=$(cat /tmp/health.json)"
          test "$code" = "200"
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v

  integration:
    name: API integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: peon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PEON_E2E: '1'
      PEON_TEST_PORT: '3100'
      PEON_TEST_BASE_URL: http://127.0.0.1:3100
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/peon_test?schema=public
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/peon_test?schema=public
      JWT_SECRET: test-jwt-secret-at-least-32-chars!!
      JWT_KEY: peon-auth-token
      ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      APP_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      EMAIL_DRIVER: test
      INSTANCE_OWNER_EMAIL: owner@peon.test
      SQS_DEPLOYMENT_QUEUE_URL: http://localhost:9324/000000000000/peon-deployments
      SQS_TASKS_QUEUE_URL: http://localhost:9324/000000000000/peon-tasks
      S3_BUCKET: peon-test-bucket
      GITHUB_APP_ID: '12345'
      GITHUB_APP_SLUG: peon-test
      GITHUB_APP_WEBHOOK_SECRET: whsec-test
      GITHUB_APP_PRIVATE_KEY: |
        -----BEGIN RSA PRIVATE KEY-----
        MIIBOgIBAAJBAKtest
        -----END RSA PRIVATE KEY-----
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm build
      - run: pnpm test:integration
        env:
          PEON_TEST_SKIP_BUILD: '1'
