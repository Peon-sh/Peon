version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    target-branch: staging
    labels:
      - dependencies
      - npm
    ignore:
      # TypeScript 7 ships no JS entry point (`main`), and `next build` resolves
      # the compiler API rather than the CLI — so it reports TypeScript as not
      # installed and the type-check step fails. Hold the major until Next
      # supports it; 6.x minor/patch updates still come through.
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      production-deps:
        dependency-type: production
      development-deps:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    target-branch: staging
    labels:
      - dependencies
      - github-actions
